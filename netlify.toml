[build.environment]
  # NEXT_PUBLIC_* values are inlined into the client bundle by design, so they are not secrets.
  # ADMIN_EMAIL is the admin login username and is the same address shown publicly on the site
  # and in public/resume.pdf. ADMIN_PASSWORD and AUTH_SECRET are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,ADMIN_EMAIL"
